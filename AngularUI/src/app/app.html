<style>
  :host {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    min-height: 100vh;
    background: #f8fafc;
    color: #111827;
  }

  * {
    box-sizing: inherit;
  }

  body {
    margin: 0;
  }

  nav {
    width: 100%;
    padding: 1rem 1.5rem;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }

  .brand {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .menu {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .menu a {
    padding: 0.75rem 1rem;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    color: #1f2937;
    background: rgba(209, 213, 219, 0.45);
    transition: background 0.2s ease, color 0.2s ease;
  }

  .menu a:hover {
    background: rgba(148, 163, 184, 0.35);
  }

  .menu a.active {
    color: #ffffff;
    background: #2563eb;
  }

  main {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    min-height: calc(100vh - 72px);
  }

  .page {
    padding: 1.5rem;
    border-radius: 1rem;
    background: #ffffff;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
  }

  .page h1 {
    margin: 0 0 0.75rem;
    font-size: 2rem;
  }

  .page p {
    margin: 0;
    color: #4b5563;
    line-height: 1.75;
  }

  @media screen and (max-width: 640px) {
    nav {
      flex-direction: column;
      align-items: stretch;
    }

    main {
      padding: 1.25rem;
    }
  }
</style>

<nav>
  <div class="brand">Vehicles Online</div>
  <div class="menu">
    <a routerLink="/manufacturer" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Manufacturer
    </a>
    <a routerLink="/vehicle-models" routerLinkActive="active">
      Vehicle Models
    </a>
  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>
